<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tahaddii TV Display</title>
  <style>
    :root {
      --bg: #080416;
      --panel: #170d30;
      --panel-2: #211047;
      --primary: #8b5cf6;
      --primary-light: #c4b5fd;
      --text: #ffffff;
      --muted: #9ca3af;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --border: #3b1d78;
    }

    * { box-sizing: border-box; }
    .is-hidden { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background:
        radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.28), transparent 34rem),
        radial-gradient(circle at 88% 14%, rgba(245, 158, 11, 0.16), transparent 30rem),
        linear-gradient(140deg, #060210 0%, #100824 52%, #05020d 100%);
      color: var(--text);
      font-family: ui-rounded, "Avenir Next", "Trebuchet MS", sans-serif;
      overflow: hidden;
    }

    body.rtl { direction: rtl; font-family: "Geeza Pro", "Avenir Next", ui-rounded, sans-serif; }

    .shell {
      height: 100vh;
      height: 100svh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(0.55rem, 1.4vh, 1.25rem);
      padding: clamp(0.7rem, 2vh, 1.8rem) clamp(0.9rem, 3vw, 3rem);
      overflow: hidden;
    }

    .topbar, .footer, .setup-card, .question-card, .scoreboard {
      border: 1px solid rgba(196, 181, 253, 0.24);
      background: rgba(23, 13, 48, 0.76);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(16px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 24px;
      padding: clamp(0.6rem, 1.5vh, 1.2rem) clamp(0.8rem, 2vw, 2rem);
      min-height: 0;
    }

    .brand { display: flex; align-items: center; gap: 1vw; }
    .brand-mark {
      width: 3.6rem;
      height: 3.6rem;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: linear-gradient(145deg, var(--primary), #2563eb);
      font-size: 1.6rem;
      font-weight: 900;
    }
    .brand-title { font-size: clamp(1.4rem, 2.4vw, 2.8rem); font-weight: 900; letter-spacing: 0; }
    .brand-sub { color: var(--muted); font-size: clamp(0.85rem, 1vw, 1.1rem); margin-top: 0.2rem; }

    .code-pill {
      border: 1px solid rgba(196, 181, 253, 0.3);
      background: rgba(139, 92, 246, 0.18);
      color: var(--primary-light);
      border-radius: 999px;
      padding: 0.8rem 1.2rem;
      font-weight: 900;
      font-size: clamp(1rem, 1.3vw, 1.35rem);
    }

    .main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(15rem, 22vw); gap: clamp(0.8rem, 1.6vw, 2rem); min-height: 0; overflow: hidden; }
    .stage { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: clamp(0.55rem, 1.35vh, 1.2rem); min-height: 0; overflow: hidden; }

    .progress-row { display: flex; align-items: center; gap: 1.4vw; }
    .progress-track { flex: 1; height: 0.75rem; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,0.1); }
    .progress-fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--primary), #22d3ee); transition: width 240ms ease; }
    .timer {
      width: clamp(4.2rem, 6vw, 7rem);
      height: clamp(4.2rem, 6vw, 7rem);
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 0.22rem solid var(--success);
      color: var(--success);
      font-size: clamp(1.7rem, 3.4vw, 4rem);
      font-weight: 900;
      background: rgba(255,255,255,0.04);
    }

    .question-card {
      border-radius: 34px;
      padding: clamp(0.8rem, 2.1vh, 2rem) clamp(0.9rem, 2.4vw, 2.4rem);
      display: grid;
      align-content: center;
      gap: clamp(0.6rem, 1.7vh, 1.5rem);
      min-height: 0;
      overflow: hidden;
    }

    .player-line { color: var(--primary-light); font-size: clamp(1.1rem, 1.7vw, 2rem); font-weight: 800; }
    .question { font-size: clamp(1.75rem, 4.6vw, 5.4rem); line-height: 1.08; font-weight: 900; text-wrap: balance; overflow-wrap: anywhere; }
    .meta-line { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: clamp(1rem, 1.3vw, 1.5rem); }

    .answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(0.45rem, 1.1vh, 1rem) clamp(0.5rem, 1vw, 1.2rem); min-height: 0; direction: ltr; }
    .answer {
      border: 2px solid rgba(196, 181, 253, 0.22);
      background: rgba(255,255,255,0.06);
      border-radius: 24px;
      padding: clamp(0.55rem, 1.1vh, 1.2rem) clamp(0.65rem, 1.2vw, 1.35rem);
      display: flex;
      align-items: center;
      gap: 1vw;
      min-height: clamp(3.6rem, 9vh, 7.4rem);
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }
    body.rtl .answer { direction: rtl; }
    .answer-letter {
      width: 3.2rem;
      height: 3.2rem;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: rgba(139, 92, 246, 0.25);
      color: var(--primary-light);
      font-size: clamp(1.2rem, 1.8vw, 2rem);
      font-weight: 900;
      flex: 0 0 auto;
    }
    .answer-text { flex: 1; font-size: clamp(1rem, 1.9vw, 2.35rem); line-height: 1.12; font-weight: 800; overflow-wrap: anywhere; }
    .answer-text .stat-good, .player-stats .stat-good { color: var(--success); font-weight: 900; }
    .answer-text .stat-bad, .player-stats .stat-bad { color: var(--error); font-weight: 900; }
    .answer-text .stat-muted { color: var(--muted); }
    .answer.selected { border-color: var(--warning); background: rgba(245, 158, 11, 0.15); }
    .answer.correct { border-color: var(--success); background: rgba(16, 185, 129, 0.18); transform: scale(1.015); }
    .answer.wrong { border-color: var(--error); background: rgba(239, 68, 68, 0.18); }

    .shell.celebrating::before,
    .shell.celebrating::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 18% 18%, rgba(245, 158, 11, 0.95) 0 0.35rem, transparent 0.45rem),
        radial-gradient(circle at 30% 26%, rgba(196, 181, 253, 0.95) 0 0.28rem, transparent 0.42rem),
        radial-gradient(circle at 78% 18%, rgba(34, 211, 238, 0.95) 0 0.32rem, transparent 0.46rem),
        radial-gradient(circle at 88% 36%, rgba(16, 185, 129, 0.95) 0 0.27rem, transparent 0.41rem),
        radial-gradient(circle at 12% 70%, rgba(239, 68, 68, 0.95) 0 0.3rem, transparent 0.44rem),
        radial-gradient(circle at 70% 78%, rgba(245, 158, 11, 0.95) 0 0.35rem, transparent 0.48rem);
      animation: fireworks 1.8s ease-out infinite;
    }
    .shell.celebrating::after {
      transform: scaleX(-1) rotate(8deg);
      animation-delay: 0.55s;
      opacity: 0.75;
    }
    .shell.celebrating .topbar,
    .shell.celebrating .main { position: relative; z-index: 1; }

    @keyframes fireworks {
      0% { opacity: 0; transform: scale(0.72); filter: blur(0); }
      18% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.26); filter: blur(1.5px); }
    }

    .winner-crown {
      display: inline-grid;
      place-items: center;
      width: clamp(4.2rem, 8vw, 8rem);
      height: clamp(4.2rem, 8vw, 8rem);
      border-radius: 50%;
      margin-inline-end: 1rem;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.28), rgba(139, 92, 246, 0.12));
      border: 1px solid rgba(245, 158, 11, 0.55);
      box-shadow: 0 0 55px rgba(245, 158, 11, 0.36);
      font-size: clamp(2.3rem, 5vw, 5.2rem);
      vertical-align: middle;
    }

    .feedback {
      border-radius: 24px;
      padding: 1.5vh 1.5vw;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.38);
      color: var(--success);
      font-size: clamp(1.1rem, 1.6vw, 2rem);
      font-weight: 900;
    }
    .feedback.hidden { display: none; }
    .feedback .sub { color: var(--text); opacity: 0.8; font-size: 0.68em; margin-top: 0.5rem; font-weight: 700; }

    .scoreboard {
      border-radius: 30px;
      padding: clamp(0.7rem, 1.5vh, 1.4rem) clamp(0.65rem, 1.2vw, 1.4rem);
      overflow: hidden;
      min-height: 0;
    }
    .score-title { font-size: clamp(1rem, 1.4vw, 1.7rem); color: var(--primary-light); font-weight: 900; margin-bottom: 1.4vh; }
    .players { display: grid; gap: clamp(0.35rem, 0.8vh, 0.8rem); max-height: 100%; overflow: hidden; }
    .player {
      display: grid;
      grid-template-columns: 0.5rem 1fr auto;
      gap: 0.9rem;
      align-items: center;
      padding: clamp(0.55rem, 1.1vh, 1rem);
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
    }
    .player-color { width: 0.5rem; align-self: stretch; border-radius: 99px; background: var(--primary); }
    .player-name { font-size: clamp(0.95rem, 1.2vw, 1.4rem); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-stats { color: var(--muted); font-size: clamp(0.75rem, 0.9vw, 1rem); margin-top: 0.2rem; }
    .player-score { font-size: clamp(1.2rem, 1.8vw, 2.2rem); font-weight: 900; color: var(--primary-light); }

    .setup {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .setup-card {
      width: min(44rem, 92vw);
      border-radius: 32px;
      padding: 2rem;
      text-align: center;
    }
    .setup-card h1 { margin: 0 0 0.7rem; font-size: clamp(2rem, 5vw, 4rem); }
    .setup-card p { color: var(--muted); font-size: 1.1rem; line-height: 1.55; }
    .qr-wrap {
      display: grid;
      justify-items: center;
      gap: 1rem;
      margin: 1.6rem 0 1rem;
    }
    .qr-card {
      background: #fff;
      border-radius: 26px;
      padding: 1rem;
      box-shadow: 0 18px 46px rgba(0,0,0,0.3);
    }
    .qr-card img { display: block; width: min(34vh, 18rem); height: min(34vh, 18rem); }
    .setup-code {
      color: var(--primary-light);
      font-size: clamp(2rem, 5vw, 4.2rem);
      font-weight: 900;
      letter-spacing: 0.12em;
    }
    .setup-waiting { color: var(--muted); font-size: 1rem; }
    .code-form { display: flex; gap: 0.8rem; margin-top: 1.5rem; }
    .code-form input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border-radius: 18px;
      padding: 1rem;
      font-size: 1.5rem;
      text-align: center;
      text-transform: uppercase;
      font-weight: 900;
    }
    .code-form button {
      border: 0;
      border-radius: 18px;
      padding: 0 1.4rem;
      background: var(--primary);
      color: var(--text);
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
    }
    .error-text { color: var(--error); margin-top: 1rem; min-height: 1.4rem; }

    @media (max-width: 900px) {
      body { overflow: hidden; }
      .shell { height: 100vh; height: 100svh; }
      .main { grid-template-columns: 1fr; }
      .answers { grid-template-columns: 1fr; }
      .scoreboard { display: none; }
    }

    @media (max-height: 620px) {
      .brand-mark { width: 2.7rem; height: 2.7rem; border-radius: 14px; font-size: 1.15rem; }
      .brand-title { font-size: 1.35rem; }
      .brand-sub { display: none; }
      .code-pill { padding: 0.55rem 0.85rem; font-size: 0.95rem; }
      .timer { width: 3.35rem; height: 3.35rem; font-size: 1.55rem; }
      .progress-track { height: 0.55rem; }
      .player-line, .meta-line { font-size: 0.95rem; }
      .question { font-size: clamp(1.45rem, 4.1vw, 3.4rem); }
      .answer-letter { width: 2.45rem; height: 2.45rem; border-radius: 12px; font-size: 1.05rem; }
      .answer-text { font-size: clamp(0.95rem, 1.65vw, 1.8rem); }
      .feedback { padding: 0.55rem 0.75rem; font-size: 1rem; }
    }

    @media (max-width: 900px) and (orientation: landscape) {
      .shell { gap: 0.45rem; padding: 0.55rem 0.7rem; }
      .topbar { padding: 0.45rem 0.7rem; border-radius: 16px; }
      .stage { gap: 0.35rem; }
      .question-card { gap: 0.42rem; padding: 0.55rem 0.65rem; border-radius: 18px; }
      .player-line, .meta-line { font-size: 0.82rem; }
      .question { font-size: clamp(1.05rem, 3.2vw, 1.75rem); line-height: 1.03; }
      .answers { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.35rem; }
      .answer { min-height: 2.55rem; padding: 0.38rem 0.45rem; border-radius: 14px; gap: 0.45rem; }
      .answer-letter { width: 2rem; height: 2rem; border-radius: 10px; font-size: 0.9rem; }
      .answer-text { font-size: 0.82rem; line-height: 1.05; }
      .timer { width: 2.65rem; height: 2.65rem; font-size: 1.15rem; border-width: 0.16rem; }
    }
  </style>
</head>
<body>
  <div id="setup" class="setup">
    <div class="setup-card">
      <h1>Tahaddii TV</h1>
      <p>Open the app, press TV before starting the game, then scan this QR code.</p>
      <div class="qr-wrap">
        <div class="qr-card"><img id="qrImage" alt="TV pairing QR code" /></div>
        <div id="setupCode" class="setup-code"></div>
        <div class="setup-waiting">Waiting for the phone to scan...</div>
      </div>
      <form id="codeForm" class="code-form">
        <input id="codeInput" maxlength="8" autocomplete="off" placeholder="CODE" />
        <button type="submit">Connect</button>
      </form>
      <div id="setupError" class="error-text"></div>
    </div>
  </div>

  <div id="display" class="shell" hidden>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">T</div>
        <div>
          <div class="brand-title">Tahaddii</div>
          <div id="brandSub" class="brand-sub">TV Display</div>
        </div>
      </div>
      <div id="codePill" class="code-pill"></div>
    </header>

    <main class="main">
      <section class="stage">
        <div class="progress-row">
          <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
          <div id="timer" class="timer">--</div>
        </div>

        <section class="question-card">
          <div id="playerLine" class="player-line"></div>
          <div id="question" class="question"></div>
          <div id="answers" class="answers"></div>
          <div class="meta-line">
            <span id="questionMeta"></span>
            <span id="pointsMeta"></span>
          </div>
        </section>

        <div id="feedback" class="feedback hidden"></div>
      </section>

      <aside class="scoreboard">
        <div id="scoreTitle" class="score-title">Scoreboard</div>
        <div id="players" class="players"></div>
      </aside>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
    import { getDatabase, onValue, ref } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyC0Hcollocb_GErLjJSjluM6DiiuYYg42E',
      authDomain: 'tahaddi-77a5d.firebaseapp.com',
      projectId: 'tahaddi-77a5d',
      databaseURL: 'https://tahaddi-77a5d-default-rtdb.asia-southeast1.firebasedatabase.app',
      storageBucket: 'tahaddi-77a5d.firebasestorage.app',
      messagingSenderId: '611215576327',
      appId: '1:611215576327:web:4aaa75e31b38864de8c9a2',
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const setup = document.getElementById('setup');
    const display = document.getElementById('display');
    const codeForm = document.getElementById('codeForm');
    const codeInput = document.getElementById('codeInput');
    const qrImage = document.getElementById('qrImage');
    const setupCode = document.getElementById('setupCode');
    const setupError = document.getElementById('setupError');
    const codePill = document.getElementById('codePill');
    const progressFill = document.getElementById('progressFill');
    const timer = document.getElementById('timer');
    const playerLine = document.getElementById('playerLine');
    const question = document.getElementById('question');
    const answers = document.getElementById('answers');
    const questionMeta = document.getElementById('questionMeta');
    const pointsMeta = document.getElementById('pointsMeta');
    const feedback = document.getElementById('feedback');
    const players = document.getElementById('players');
    const scoreTitle = document.getElementById('scoreTitle');
    const brandSub = document.getElementById('brandSub');

    const labels = {
      ar: { display: 'عرض التلفاز', score: 'النتيجة', question: 'سؤال', points: 'نقطة', turn: 'الدور', correct: 'الإجابة الصحيحة', missing: 'بانتظار بدء العرض من الجوال', final: 'النتيجة النهائية', winner: 'الفائز', correctCount: 'صح', wrongCount: 'خطأ', returningHome: 'العودة للرئيسية خلال' },
      en: { display: 'TV Display', score: 'Scoreboard', question: 'Question', points: 'pts', turn: 'Turn', correct: 'Correct Answer', missing: 'Waiting for the phone to start the display', final: 'Final Results', winner: 'Winner', correctCount: 'Correct', wrongCount: 'Wrong', returningHome: 'Returning home in' },
    };

    const getCodeFromUrl = () => new URLSearchParams(window.location.search).get('code')?.trim().toUpperCase() || '';
    const normalizeCode = value => value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
    const createDisplayCode = () => {
      const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      return Array.from({ length: 5 }, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join('');
    };
    const setText = (element, value) => { element.textContent = value ?? ''; };

    let unsubscribe = null;
    let pollTimer = null;
    let finalReturnTimer = null;

    codeInput.value = getCodeFromUrl() || createDisplayCode();
    renderSetupCode(codeInput.value);
    connect(codeInput.value);

    codeInput.addEventListener('input', () => {
      codeInput.value = normalizeCode(codeInput.value);
      renderSetupCode(codeInput.value);
    });

    codeForm.addEventListener('submit', event => {
      event.preventDefault();
      connect(normalizeCode(codeInput.value));
    });

    function renderSetupCode(code) {
      const normalizedCode = normalizeCode(code);
      setText(setupCode, normalizedCode);
      const payload = `https://tahaddi-77a5d.web.app/tv/?code=${encodeURIComponent(normalizedCode)}`;
      qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=420x420&margin=20&data=${encodeURIComponent(payload)}`;
    }

    async function connect(code) {
      if (!code) return;
      setupError.textContent = '';
      try {
        if (unsubscribe) unsubscribe();
        if (pollTimer) clearInterval(pollTimer);
        window.history.replaceState(null, '', `/tv/?code=${encodeURIComponent(code)}`);
        unsubscribe = onValue(ref(db, `tvDisplaySessions/${code}`), snapshot => {
          const state = snapshot.val();
          if (!state) {
            showSetup();
            setupError.textContent = '';
            return;
          }
          render(state);
        }, error => {
          setupError.textContent = error.message;
        });
        pollTimer = setInterval(() => {
          void fetch(`https://tahaddi-77a5d-default-rtdb.asia-southeast1.firebasedatabase.app/tvDisplaySessions/${encodeURIComponent(code)}.json?ts=${Date.now()}`)
            .then(response => response.ok ? response.json() : null)
            .then(state => { if (state) render(state); })
            .catch(() => {});
        }, 1200);
      } catch (error) {
        setupError.textContent = error.message;
      }
    }

    function render(state) {
      const lang = state.language === 'ar' ? 'ar' : 'en';
      const copy = labels[lang];
      document.body.classList.toggle('rtl', lang === 'ar');
      showDisplay();
      display.classList.toggle('celebrating', state.status === 'finished');

      setText(codePill, state.code || '');
      setText(brandSub, copy.display);
      setText(scoreTitle, copy.score);
      if (state.status === 'finished') {
        renderFinalResults(state, copy);
        return;
      }

      clearFinalReturnTimer();

      if (state.status === 'pairing' || !state.question) {
        setText(playerLine, '');
        setText(question, copy.missing);
        setText(questionMeta, '');
        setText(pointsMeta, '');
        progressFill.style.width = '0%';
        setText(timer, '--');
        answers.replaceChildren();
        feedback.classList.add('hidden');
        renderPlayers(state.players || []);
        return;
      }

      setText(playerLine, state.currentPlayer ? `${copy.turn}: ${state.currentPlayer.name} · ${state.currentPlayer.score} ${copy.points}` : '');
      setText(question, state.question?.text || '');
      setText(questionMeta, `${copy.question} ${(state.questionIndex ?? 0) + 1} / ${state.totalQuestions ?? 1}`);
      setText(pointsMeta, `${state.question?.points ?? 0} ${copy.points}`);

      const total = Math.max(1, Number(state.totalQuestions || 1));
      const current = Math.min(total, Number(state.questionIndex || 0) + 1);
      progressFill.style.width = `${(current / total) * 100}%`;

      const timeLeft = state.timeLeft;
      setText(timer, timeLeft == null ? '∞' : timeLeft);
      const timerColor = timeLeft == null ? 'var(--primary-light)' : timeLeft <= 3 ? 'var(--error)' : timeLeft <= 7 ? 'var(--warning)' : 'var(--success)';
      timer.style.color = timerColor;
      timer.style.borderColor = timerColor;

      renderAnswers(state, lang);
      renderFeedback(state, copy);
      renderPlayers(state.players || []);
    }

    function renderFinalResults(state, copy) {
      const sortedPlayers = [...(state.players || [])].sort((left, right) => (right.score || 0) - (left.score || 0));
      const winner = sortedPlayers[0];
      setText(playerLine, copy.final);
      question.replaceChildren();
      if (winner) {
        const crown = document.createElement('span');
        crown.className = 'winner-crown';
        crown.textContent = '🏆';
        const winnerText = document.createElement('span');
        winnerText.textContent = `${copy.winner}: ${winner.name}`;
        question.append(crown, winnerText);
      } else {
        setText(question, copy.final);
      }
      setText(questionMeta, `${copy.question} ${state.totalQuestions || 0} / ${state.totalQuestions || 0}`);
      setText(pointsMeta, winner ? `${winner.score || 0} ${copy.points}` : '');
      progressFill.style.width = '100%';
      setText(timer, '🏆');
      timer.style.color = 'var(--warning)';
      timer.style.borderColor = 'var(--warning)';
      startFinalReturnTimer(copy);

      answers.replaceChildren();
      sortedPlayers.slice(0, 4).forEach((player, index) => {
        const item = document.createElement('div');
        item.className = 'answer';
        if (index === 0) item.classList.add('correct');
        const letter = document.createElement('div');
        letter.className = 'answer-letter';
        letter.textContent = ['🥇', '🥈', '🥉'][index] || String(index + 1);
        const text = document.createElement('div');
        text.className = 'answer-text';
        const playerName = document.createElement('span');
        playerName.textContent = `${player.name || ''} · ${player.score || 0} ${copy.points} · `;
        const correct = document.createElement('span');
        correct.className = 'stat-good';
        correct.textContent = `✓ ${player.correctAnswers || 0} ${copy.correctCount}`;
        const separator = document.createElement('span');
        separator.className = 'stat-muted';
        separator.textContent = ' · ';
        const wrong = document.createElement('span');
        wrong.className = 'stat-bad';
        wrong.textContent = `✗ ${player.wrongAnswers || 0} ${copy.wrongCount}`;
        text.append(playerName, correct, separator, wrong);
        item.append(letter, text);
        answers.append(item);
      });

      renderPlayers(sortedPlayers);
    }

    function clearFinalReturnTimer() {
      if (finalReturnTimer) {
        clearInterval(finalReturnTimer);
        finalReturnTimer = null;
      }
    }

    function startFinalReturnTimer(copy) {
      if (finalReturnTimer) return;
      let secondsLeft = 30;
      feedback.classList.remove('hidden');
      const updateCountdown = () => {
        setText(feedback, `${copy.returningHome} ${secondsLeft}`);
      };
      updateCountdown();
      finalReturnTimer = setInterval(() => {
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          clearFinalReturnTimer();
          window.location.href = '/';
          return;
        }
        updateCountdown();
      }, 1000);
    }

    function showSetup() {
      clearFinalReturnTimer();
      setup.hidden = false;
      setup.classList.remove('is-hidden');
      display.hidden = true;
      display.classList.add('is-hidden');
    }

    function showDisplay() {
      setup.hidden = true;
      setup.classList.add('is-hidden');
      display.hidden = false;
      display.classList.remove('is-hidden');
    }

    function renderAnswers(state, lang) {
      answers.replaceChildren();
      const letters = lang === 'ar' ? ['أ', 'ب', 'ج', 'د'] : ['A', 'B', 'C', 'D'];
      (state.answers || []).forEach((answer, index) => {
        const item = document.createElement('div');
        item.className = 'answer';
        if (answer.isSelected) item.classList.add('selected');
        if (answer.isCorrect) item.classList.add('correct');
        if (answer.isSelected && state.status === 'revealed' && !answer.isCorrect) item.classList.add('wrong');

        const letter = document.createElement('div');
        letter.className = 'answer-letter';
        letter.textContent = letters[index] || String(index + 1);
        const text = document.createElement('div');
        text.className = 'answer-text';
        text.textContent = answer.text || '';
        item.append(letter, text);
        answers.append(item);
      });
    }

    function renderFeedback(state, copy) {
      feedback.replaceChildren();
      if (state.status !== 'revealed' && state.status !== 'finished') {
        feedback.classList.add('hidden');
        return;
      }
      feedback.classList.remove('hidden');
      const title = document.createElement('div');
      title.textContent = state.correctAnswer ? `${copy.correct}: ${state.correctAnswer}` : copy.correct;
      feedback.append(title);
      if (state.explanation) {
        const sub = document.createElement('div');
        sub.className = 'sub';
        sub.textContent = state.explanation;
        feedback.append(sub);
      }
    }

    function renderPlayers(playerList) {
      players.replaceChildren();
      [...playerList]
        .sort((left, right) => (right.score || 0) - (left.score || 0))
        .forEach(player => {
          const row = document.createElement('div');
          row.className = 'player';
          const color = document.createElement('div');
          color.className = 'player-color';
          color.style.background = player.color || 'var(--primary)';
          const body = document.createElement('div');
          const name = document.createElement('div');
          name.className = 'player-name';
          name.textContent = player.name || '';
          const stats = document.createElement('div');
          stats.className = 'player-stats';
          const correct = document.createElement('span');
          correct.className = 'stat-good';
          correct.textContent = `✓ ${player.correctAnswers || 0}`;
          const wrong = document.createElement('span');
          wrong.className = 'stat-bad';
          wrong.textContent = `✗ ${player.wrongAnswers || 0}`;
          stats.append(correct, document.createTextNode('  '), wrong);
          body.append(name, stats);
          const score = document.createElement('div');
          score.className = 'player-score';
          score.textContent = player.score || 0;
          row.append(color, body, score);
          players.append(row);
        });
    }

    if (codeInput.value) connect(codeInput.value);
  </script>
</body>
</html>
